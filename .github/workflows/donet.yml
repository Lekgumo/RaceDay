name: .NET

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.sln --no-restore --configuration Release --verbosity normal

      - name: Validate Docs folder
        run: |
          if [ ! -d "Docs" ]; then
            echo "❌ /Docs folder not found!"
            exit 1
          fi
          for f in "ERD.png" "API_Documentation2.0.md" "RACEDAYSQL.sql"; do
            if [ ! -f "Docs/$f" ]; then
              echo "❌ Docs/$f missing!"
              exit 1
            fi
          done
          echo "✅ Docs folder validated successfully."
